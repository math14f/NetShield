<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NetShield – Side blokeret</title>

<style>
:root{
  --bg:#f3f6fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --primary:#2563eb;
  --danger:#dc2626;
  --border:#e5e7eb;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* Entrance animation */
@keyframes fadeSlide {
  from { opacity:0; transform:translateY(25px) scale(.98); }
  to { opacity:1; transform:translateY(0) scale(1); }
}

.card{
  background:var(--card);
  max-width:520px;
  width:100%;
  border-radius:16px;
  box-shadow:0 20px 40px rgba(0,0,0,.08);
  padding:32px 28px;
  text-align:center;
  border:1px solid var(--border);
  animation:fadeSlide .6s ease forwards;
  transition:transform .3s ease, box-shadow .3s ease;
}

/* Subtle hover depth */
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 30px 60px rgba(0,0,0,.12);
}

/* Icon pulse */
@keyframes pulse {
  0%,100% { box-shadow:0 0 0 0 rgba(220,38,38,.25); }
  50% { box-shadow:0 0 0 10px rgba(220,38,38,0); }
}

.icon{
  width:70px;
  height:70px;
  margin:0 auto 16px;
  border-radius:50%;
  background:#fee2e2;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:pulse 2.5s infinite;
}

.icon svg{
  width:34px;
  color:var(--danger);
}

h1{
  font-size:22px;
  margin-bottom:10px;
}

p{
  color:var(--muted);
  font-size:15px;
  line-height:1.5;
}

.box{
  background:#f9fafb;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin:18px 0;
  font-size:14px;
  color:#374151;
  transition:background .3s ease;
}

.box:hover{
  background:#f3f4f6;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}

button{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
}

/* Button hover lift */
button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(0,0,0,.12);
}

/* Click ripple */
button:active::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.4);
  animation:ripple .4s ease;
}

@keyframes ripple{
  from{opacity:.6;}
  to{opacity:0;}
}

.primary{
  background:var(--primary);
  color:white;
}

.secondary{
  background:#e5e7eb;
}

.footer{
  margin-top:18px;
  font-size:12px;
  color:#9ca3af;
  opacity:0;
  animation:fadeIn .8s ease forwards;
  animation-delay:.4s;
}

@keyframes fadeIn{
  to{opacity:1;}
}
</style>
</head>

<body>

<div class="card">

  <div class="icon">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M12 9v2m0 4h.01M5.1 19h13.8c1.6 0 2.6-1.7 1.8-3.1L13.8 4.9c-.8-1.4-2.8-1.4-3.6 0L3.3 15.9c-.8 1.4.2 3.1 1.8 3.1Z"/>
    </svg>
  </div>

  <h1>Denne side er blokeret</h1>

  <p>
    NetShield har stoppet siden, fordi den ikke er tilladt på skolens netværk.
  </p>

  <div class="box">
    Hvis du mener, at siden skal bruges til undervisning,  
    så spørg din lærer eller skolens IT-ansvarlige om hjælp.
  </div>

  <div class="buttons">
    <button class="primary" onclick="location.href='https://google.com'">
      Gå til Google
    </button>
  </div>

  <div class="footer">
    NetShield v3.6 • Beskytter elever online
  </div>

</div>

</body>
</html>
